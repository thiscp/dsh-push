server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location /probe.txt { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 127.0.0.1:9443 ssl;
    listen [::]:9443 ssl;
    http2 on;
    server_name cpyh.xyz www.cpyh.xyz;
    ssl_certificate     /etc/nginx/certs-edge/cpyh.xyz.pem;
    ssl_certificate_key /etc/nginx/certs-edge/cpyh.xyz.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 127.0.0.1:9443 ssl;
    listen [::]:9443 ssl;
    http2 on;
    server_name ntfy.cpyh.xyz;
    ssl_certificate     /etc/nginx/certs-edge/ntfy.cpyh.xyz.pem;
    ssl_certificate_key /etc/nginx/certs-edge/ntfy.cpyh.xyz.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location /dl/ { alias /var/www/certbot/dl/; }
    location /answer {
        proxy_pass http://127.0.0.1:2587;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location / {
        proxy_pass http://127.0.0.1:2586;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        client_max_body_size 2m;
    }
}
