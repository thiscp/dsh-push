org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# task-20 (2026-10-13): build speed-up, measured on the build box (test-machine-1).
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.jvmargs=-Xmx4g -Xss8m -Dfile.encoding=UTF-8

# 2026-10-25 (v1.33.40): WebActivity.kt 里有一条 320+ 段的巨型 "+" 字符串链（注入用 JS），
# psi2ir 生成二元表达式时按左结合递归 O(N)，默认线程栈（512K~1M）会被打穿：
#   BackendException: Backend Internal error: Exception during psi2ir / Caused by: StackOverflowError
#   File being compiled: WebActivity.kt
# 两个都加：Gradle 主 JVM 与 Kotlin 编译器 daemon 各给 8M/16M 栈。
# 注意 psi2ir 只在「改动后重新编译」时触发，所以这类炸栈常常在版本号一变时才冒出来。
kotlin.daemon.jvmargs=-Xmx3g -Xss16m -Dfile.encoding=UTF-8
